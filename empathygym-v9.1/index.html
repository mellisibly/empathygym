const TH={"ru":[{"t":"Что такое эмоциональная валидация?","b":"**Эмоциональная валидация** — это признание и принятие чувств другого человека. Когда мы валидируем эмоции, мы говорим: «Я вижу, что тебе сейчас тяжело, и это нормально — так чувствовать».\n\nМы не пытаемся **исправить**, **обесценить** или **переключить** человека. Мы просто даём понять, что его чувства имеют значение."},{"t":"Почему это важно?","b":"Когда человек чувствует, что его эмоции приняты, он быстрее успокаивается, больше доверяет собеседнику и чувствует себя **менее одиноким**. Исследования показывают, что валидация **снижает уровень стресса** и укрепляет отношения.\n\nНа уровне нейробиологии: когда наши эмоции принимают, нервная система получает сигнал безопасности — выделяется **окситоцин** (гормон привязанности) и снижается **кортизол** (гормон стресса). А **обесценивание** мозг воспринимает как отвержение — почти так же, как **физическую боль**."},{"t":"Валидация в отношениях","b":"В близких отношениях валидация — это **фундамент доверия**. Исследования психолога **Джона Готтмана** показали: пары, где партнёры регулярно отвечают на эмоциональные запросы друг друга с вниманием и принятием, значительно более удовлетворены отношениями.\n\nГоттман называет это **«поворотом навстречу»** (turning toward) — и по этому паттерну можно с высокой точностью предсказать, останется ли пара вместе.\n\nКогда партнёр чувствует, что его эмоции принимают, возникает ощущение **эмоциональной безопасности**. А безопасность — основа для уязвимости и близости. Без валидации включается защитная реакция: человек закрывается и перестаёт делиться переживаниями.\n\nПары, которые практикуют валидацию, лучше справляются с конфликтами, общаются более открыто и чувствуют более глубокую **эмоциональную связь**."},{"t":"6 уровней валидации (по Марше Линехан)","b":"1. **Присутствие** — быть рядом, слушать, не отвлекаясь.\n2. **Точное отражение** — пересказать то, что человек сказал, своими словами.\n3. **Чтение между строк** — озвучить чувства, которые человек не назвал напрямую.\n4. **Понимание через историю** — «Учитывая то, что ты пережил, логично, что ты так себя чувствуешь».\n5. **Нормализация** — «Любой на твоём месте чувствовал бы то же самое».\n6. **Радикальная искренность** — относиться к человеку как к равному, без жалости или покровительства."},{"t":"Что НЕ является валидацией","b":"• **Советы без запроса:** «А ты попробуй…»\n• **Обесценивание:** «Да ладно, не переживай», «Бывает и хуже»\n• **Переключение на себя:** «У меня тоже так было…»\n• **Токсичный позитив:** «Зато у тебя всё остальное хорошо!»\n• **Логические аргументы:** «Но ведь объективно…»\n• **Обвинение:** «Ну ты сам виноват»"},{"t":"Но разве не лучше помочь советом?","b":"Это самый частый вопрос, и он понятен: нам кажется, что **помочь — значит подсказать решение**. Но вот почему это не работает:\n\n**Совет до валидации воспринимается как отвержение.** Когда человек делится переживанием, а в ответ слышит «а ты попробуй…» — он считывает: «твои чувства неважны, давай скорее к делу».\n\n**Совет создаёт зависимость, а не опору.** Человек, который постоянно получает советы, теряет уверенность в своих решениях. Валидация же помогает ему **опираться на себя**.\n\n**Совет — это ваше решение, не его.** Любой совет — лишь наша интерпретация чужой ситуации, без знания всех нюансов. Только он сам — эксперт в своей жизни.\n\nЧто делать вместо совета? Сначала — **валидировать**. А потом спросить: «Тебе сейчас нужна помощь с решением или просто поддержка?»"},{"t":"Загадки общения, которые решает валидация","b":"Валидация — навык, который не преподают в школе. Его не объясняют родители (потому что их тоже не учили). Именно отсутствие этого навыка стоит за большинством сбоев в общении — от мелких недоразумений до крупных разрывов.\n\nНиже — шесть типичных ситуаций. Все они выглядят по-разному, но устроены одинаково: человек чувствует боль, а окружающие — из лучших побуждений — делают хуже.\n\n**«Она не хочет решения — она хочет быть услышанной»**\n\nРефлекс «починить» выглядит как забота, но несёт скрытое послание: «твоё чувство — помеха, давай его уберём». Человек часто знает решение. Но прежде чем думать — ему нужно быть услышанным. Это не про гендер. Потребность чувствовать себя понятым — **базовая**, она не зависит от пола, возраста или характера.\n\nВалидация убирает давление «починить». Даёт боли право существовать. Не торопится к решению — и именно поэтому решение потом приходит быстрее.\n\n**«Я хотел поддержать — а стало хуже»**\n\n«Не переживай». «Всё будет хорошо». «Могло быть и хуже». Каждая из этих фраз — попытка помочь. И каждая — **инвалидация**. Чувство отвергается, преуменьшается или объясняется «неправильным». Человек, который говорит «не грусти», хочет, чтобы вам стало лучше. Но на деле он говорит: «твоя эмоция неуместна».\n\nВалидация не оценивает эмоцию как хорошую или плохую — а признаёт, что она есть и что она обоснована. «Конечно тебе страшно — это серьёзная ситуация» вместо «да брось, ничего страшного».\n\n**«Мы согласны — но всё равно ссоримся»**\n\nЧасто конфликт — не про содержание. Настоящая боль не в теме спора, а в ощущении «**меня не слышат**». Когда человек чувствует, что его переживание признано, он становится менее эмоциональным и более открытым.\n\n**Двойной удар** — когда реакция на боль причиняет вторую боль — опаснее самого конфликта. «Ты опять устраиваешь сцену» учит: говорить о том, что больно, небезопасно. Молчание — не мир. Это стена.\n\nВалидация снимает защиту. Конфликт теряет топливо — не потому что проблема решена, а потому что отношения снова безопасны.\n\n**«Ребёнок истерит — ничего не помогает»**\n\nРодительский рефлекс — починить, отвлечь, успокоить. Каждая из этих реакций говорит ребёнку: твоё чувство — проблема. Ребёнок, которому регулярно говорят «не плачь», учится не тому, что плакать не нужно. Он учится, что его **чувства неважны**.\n\nДети, чьи эмоции признаются, учатся их называть, переживать и отпускать. Это фундамент **эмоционального интеллекта**. Интенсивность эмоции падает сама, когда она названа и признана.\n\n**«Почему я так жёсток к себе»**\n\nВнутренний критик — не врождённая черта. Это **выученный голос**. Он появляется, когда в детстве чувства регулярно игнорировались или наказывались. Если никто не валидировал твои чувства, ты не умеешь валидировать их сам. И каждый промах становится не «я ошибся», а «я плохой».\n\nВалидация разделяет поступок и личность. Можно сожалеть о том, что сделал, не уничтожая себя за то, кто ты есть. **Самовалидация** — навык, которому можно научиться.\n\n**«Если я признаю его чувства — значит я соглашаюсь?»**\n\nСамое распространённое заблуждение: признать чувство = согласиться с позицией. Нет. Валидация — не про правоту. Она про **признание опыта**. Можно полностью признать чувство человека и при этом думать иначе.\n\nВалидация разделяет «я слышу тебя» и «я с тобой согласен». Создаёт пространство, где можно не совпадать — и при этом не терять друг друга.\n\n**Парадокс: признание ускоряет изменение.** Когда человек чувствует, что его услышали, эмоциональная интенсивность снижается. Мозг перестаёт защищаться и начинает думать. Попытка решить проблему до того, как человек почувствовал себя услышанным — это как пытаться поговорить с человеком, который тонет. Сначала — вытащить. Потом — разговаривать."},{"t":"Как практиковать","b":"1. **Сделайте паузу** перед ответом.\n2. Спросите себя: **«Что сейчас чувствует этот человек?»**\n3. **Назовите чувство:** «Похоже, тебе сейчас обидно».\n4. **Примите без условий:** «Это понятно».\n5. **Спросите, чем помочь** — а не предлагайте сами.\n\nВ **«Тренажёрах»** вы сможете потренироваться на разных упражнениях, а в **«Марафоне»** — практиковать валидацию каждый день в реальной жизни."}],"en":[{"t":"What is emotional validation?","b":"**Emotional validation** is recognizing and accepting another person's feelings. When we validate emotions, we say: \"I see that you're having a hard time, and it's okay to feel that way.\"\n\nWe don't try to **fix**, **dismiss**, or **redirect**. We simply let them know their feelings matter."},{"t":"Why does it matter?","b":"When people feel their emotions are accepted, they calm down faster, trust the listener more, and feel **less alone**. Research shows that validation **reduces stress** and strengthens relationships.\n\nOn a neurobiological level: when our emotions are accepted, our nervous system receives a safety signal — **oxytocin** (the bonding hormone) is released and **cortisol** (the stress hormone) drops. **Invalidation**, on the other hand, is processed by the brain almost like **physical pain**."},{"t":"Validation in relationships","b":"In close relationships, validation is the **foundation of trust**. Psychologist **John Gottman's** research showed: couples who regularly respond to each other's emotional bids with attention and acceptance report significantly higher relationship satisfaction.\n\nGottman calls this **\"turning toward\"** — and this pattern can predict with high accuracy whether a couple will stay together.\n\nWhen a partner feels their emotions are accepted, a sense of **emotional safety** emerges. And safety is the foundation for vulnerability and intimacy. Without validation, defenses kick in: the person shuts down and stops sharing.\n\nCouples who practice validation handle conflicts better, communicate more openly, and feel a deeper **emotional connection**."},{"t":"6 Levels of Validation (by Marsha Linehan)","b":"1. **Being present** — listening attentively, without distractions.\n2. **Accurate reflection** — paraphrasing what the person said.\n3. **Reading between the lines** — naming feelings the person didn't express directly.\n4. **Understanding through history** — \"Given what you've been through, it makes sense you feel this way.\"\n5. **Normalizing** — \"Anyone in your situation would feel the same.\"\n6. **Radical genuineness** — treating the person as an equal, without pity or condescension."},{"t":"What is NOT validation","b":"• **Unsolicited advice:** \"You should try…\"\n• **Dismissing:** \"Don't worry about it\", \"It could be worse\"\n• **Making it about yourself:** \"I had the same thing…\"\n• **Toxic positivity:** \"At least everything else is great!\"\n• **Logical arguments:** \"But objectively…\"\n• **Blaming:** \"Well, it's your own fault\\\""},{"t":"But isn't it better to just give advice?","b":"This is the most common question, and it makes sense: we assume that **helping means offering a solution**. But here's why it doesn't work:\n\n**Advice before validation feels like rejection.** When someone shares their pain and hears \"you should try…\" in response, they interpret it as: \"your feelings don't matter, let's move on to fixing things.\"\n\n**Advice creates dependency, not strength.** A person who constantly receives advice gradually loses confidence in their own decisions. Validation helps them **rely on themselves**.\n\n**Advice is your solution, not theirs.** Any advice is just our interpretation of someone else's situation, without knowing all the nuances. Only they are the expert on their own life.\n\nWhat to do instead? **Validate first**. Then ask: \"Do you need help figuring this out, or do you just need support right now?\\\""},{"t":"Communication puzzles that validation solves","b":"Validation is a skill nobody teaches in school. Parents don't explain it (because nobody taught them either). Yet the absence of this skill is behind most communication breakdowns — from minor misunderstandings to major ruptures.\n\nBelow are six typical situations. They all look different, but work the same way: a person is in pain, and others — with the best intentions — make it worse.\n\n**\"She doesn't want a solution — she wants to be heard\"**\n\nThe reflex to \"fix\" looks like caring, but carries a hidden message: \"your feeling is an obstacle, let's remove it.\" People often know the solution. But before they can think — they need to feel heard. This isn't about gender. The need to feel understood is **fundamental** — it doesn't depend on sex, age, or personality.\n\nValidation removes the pressure to \"fix.\" It gives pain the right to exist. It doesn't rush to a solution — and that's exactly why the solution comes faster.\n\n**\"I tried to help — and made it worse\"**\n\n\"Don't worry.\" \"It'll be fine.\" \"Could be worse.\" Each of these phrases is an attempt to help. And each is **invalidation**. The feeling is rejected, minimized, or labeled \"wrong.\" The person who says \"don't be sad\" wants you to feel better. But what they're actually saying is: \"your emotion is inappropriate.\"\n\nValidation doesn't judge an emotion as good or bad — it acknowledges that the emotion exists and makes sense. \"Of course you're scared — this is a serious situation\" instead of \"come on, it's nothing.\"\n\n**\"We agree — but we're still fighting\"**\n\nOften the conflict isn't about the content. The real pain isn't the topic — it's the feeling of \"**I'm not being heard**.\" When a person feels their experience is acknowledged, they become less reactive and more open.\n\nThe **double blow** — when the response to pain causes a second pain — is more dangerous than the conflict itself. \"You're making a scene again\" teaches: it's not safe to talk about what hurts. Silence isn't peace. It's a wall.\n\nValidation lowers defenses. The conflict loses fuel — not because the problem is solved, but because the relationship feels safe again.\n\n**\"My child is having a meltdown — nothing helps\"**\n\nThe parental reflex is to fix, distract, calm down. Each of these reactions tells the child: your feeling is a problem. A child who regularly hears \"don't cry\" doesn't learn that crying is unnecessary. They learn that their **feelings don't matter**.\n\nChildren whose emotions are acknowledged learn to name, process, and release them. This is the foundation of **emotional intelligence**. The intensity of an emotion drops on its own when it's named and recognized.\n\n**\"Why am I so hard on myself\"**\n\nThe inner critic isn't innate. It's a **learned voice**. It appears when feelings were regularly ignored or punished in childhood. If nobody validated your feelings, you can't validate them yourself. And every mistake becomes not \"I made an error\" but \"I'm a bad person.\"\n\nValidation separates the action from the person. You can regret what you did without destroying yourself for who you are. **Self-validation** is a skill that can be learned.\n\n**\"If I acknowledge their feelings — does that mean I agree?\"**\n\nThe most common misconception: acknowledging a feeling = agreeing with a position. No. Validation isn't about being right. It's about **acknowledging experience**. You can fully acknowledge someone's feelings while thinking differently.\n\nValidation separates \"I hear you\" from \"I agree with you.\" It creates space where you can disagree — without losing each other.\n\n**The paradox: acknowledgment accelerates change.** When a person feels heard, emotional intensity drops. The brain stops defending and starts thinking. Trying to solve a problem before a person feels heard is like trying to talk to someone who's drowning. First — pull them out. Then — talk."},{"t":"How to practice","b":"1. **Pause** before responding.\n2. Ask yourself: **\"What is this person feeling right now?\"**\n3. **Name the feeling:** \"It sounds like you're hurt.\"\n4. **Accept unconditionally:** \"That makes sense.\"\n5. **Ask how to help** — rather than offering solutions.\n\nIn **\"Trainers\"** you'll practice with different exercises, and in **\"Marathon\"** you'll practice validation every day in real life."}]};
const MD={"ru":[{"d":1,"df":"ey","cx":"fr","tk":"Когда кто-то сегодня пожалуется — скажи одно предложение без совета. Просто назови что человек чувствует.","q1":"Получилось сдержать совет?","q2":"Что сказал вместо него?"},{"d":2,"df":"ey","cx":"sl","tk":"Вспомни последний разговор где тебе было плохо. Что хотел услышать в ответ — но не услышал?","q1":"Одним предложением — какая валидация была бы точной.","q2":"Легко ли было это сформулировать?"},{"d":3,"df":"ey","cx":"cl","tk":"Сегодня в разговоре — дай человеку договорить до конца. Не заканчивай его мысль.","q1":"Было желание перебить?","q2":"В какой момент?"},{"d":4,"df":"ey","cx":"pt","tk":"Когда партнёр сегодня скажет «всё нормально» — спроси один раз: «точно?». И послушай.","q1":"Что оказалось за «нормально»?","q2":"Ожидал ли этого?"},{"d":5,"df":"ey","cx":"sl","tk":"Сегодня заметь один момент когда тебе было некомфортно. Назови это чувство — хотя бы про себя.","q1":"Как называлось чувство?","q2":"Легко ли было его найти?"},{"d":6,"df":"ey","cx":"fr","tk":"В следующем разговоре где друг жалуется — не говори «я понимаю». Скажи что именно ты понимаешь.","q1":"Что сказал вместо «понимаю»?","q2":"Как звучало?"},{"d":7,"df":"ey","cx":"cl","tk":"Когда коллега сегодня расстроится из-за мелочи — не говори «да ладно, это мелочь». Просто кивни.","q1":"Трудно было не обесценить?","q2":"Что почувствовал?"},{"d":8,"df":"ey","cx":"pt","tk":"Напиши партнёру короткое сообщение: «Как ты?» — и искренне подожди ответа. Не добавляй своих новостей.","q1":"Что он ответил?","q2":"Ожидал ли этого?"},{"d":9,"df":"ey","cx":"sl","tk":"Когда сегодня тебе будет плохо — не говори себе «соберись». Скажи что именно тяжело.","q1":"Что было тяжело?","q2":"Легче ли стало когда назвал?"},{"d":10,"df":"md","cx":"fr","tk":"В разговоре где друг злится — не успокаивай и не объясняй почему злиться не стоит. Скажи только что злость понятна.","q1":"Удержался от объяснений?","q2":"Что было труднее всего?"},{"d":11,"df":"md","cx":"pt","tk":"Вспомни момент за последнюю неделю где ты пытался утешить партнёра. Что сказал? Что было бы точнее?","q1":"Одним предложением — как бы ответил сейчас.","q2":"Почему тогда сказал иначе?"},{"d":12,"df":"md","cx":"cl","tk":"Когда коллега скажет «я наверное преувеличиваю» — не соглашайся и не разубеждай. Скажи что его ощущение реальное.","q1":"Как отреагировал коллега?","q2":"Изменился ли разговор?"},{"d":13,"df":"md","cx":"sl","tk":"Найди ситуацию за последнюю неделю где ты обесценил своё чувство. Как бы ответил себе сейчас?","q1":"Что именно обесценил?","q2":"Почему тогда так сделал?"},{"d":14,"df":"md","cx":"pt","tk":"Когда партнёр сегодня скажет что устал — не предлагай решение. Спроси: «от чего именно?»","q1":"Что оказалось за усталостью?","q2":"Куда пошёл разговор?"},{"d":15,"df":"md","cx":"sl","tk":"Сегодня заметь один момент когда ты обесценил чьё-то чувство — даже мысленно. Просто заметь, не осуждай себя.","q1":"Что это было?","q2":"Почему захотелось обесценить?"},{"d":16,"df":"md","cx":"fr","tk":"В разговоре с другом — скажи одно предложение которое признаёт его состояние. Без «но» после.","q1":"Как он отреагировал?","q2":"Было ли трудно не добавить «но»?"},{"d":17,"df":"md","cx":"cl","tk":"Когда коллега будет винить себя за ошибку — не говори «ты не виноват». Признай что ему тяжело это носить.","q1":"Что сказал?","q2":"Чем это отличается от «ты не виноват»?"},{"d":18,"df":"md","cx":"sl","tk":"Попробуй самовалидацию вслух. Скажи себе одно предложение про то что сейчас трудно — без оценки и без плана.","q1":"Что сказал?","q2":"Как звучало?"},{"d":19,"df":"hd","cx":"pt","tk":"В разговоре где партнёр злится — сначала признай его злость. Потом говори остальное.","q1":"Изменился ли разговор после признания?","q2":"Как именно?"},{"d":20,"df":"hd","cx":"fr","tk":"Найди друга которому сейчас плохо — и скажи что-то валидирующее не потому что он попросил, а потому что ты заметил.","q1":"Как он отреагировал на неожиданную поддержку?","q2":"Трудно ли было начать первым?"},{"d":21,"df":"hd","cx":"cl","tk":"Когда коллега будет говорить о боли которую ты не разделяешь — не говори «я бы на твоём месте». Признай что его опыт другой.","q1":"Трудно было не сравнивать со своим опытом?","q2":"Что сказал вместо этого?"},{"d":22,"df":"hd","cx":"sl","tk":"Когда сегодня захочется обесценить своё состояние — заметь этот момент и скажи себе одно предложение которое признаёт что тебе сейчас трудно.","q1":"Что именно хотелось обесценить?","q2":"Получилось остановить внутренний голос?"},{"d":23,"df":"hd","cx":"pt","tk":"В разговоре где партнёр говорит о двух противоречивых чувствах — назови оба. Не выбирай между ними.","q1":"Как он отреагировал когда оба чувства были признаны?","q2":"Трудно ли было не выбрать одно?"},{"d":24,"df":"hd","cx":"fr","tk":"Сегодня промолчи там где обычно утешаешь. Просто кивни или скажи «да». Посмотри что будет.","q1":"Что произошло после паузы?","q2":"Куда пошёл разговор?"},{"d":25,"df":"hd","cx":"sl","tk":"Найди чувство за которое тебе стыдно. Скажи себе одно предложение которое признаёт его — без осуждения.","q1":"Что это было за чувство?","q2":"Легче ли стало после признания?"},{"d":26,"df":"hd","cx":"cl","tk":"В разговоре где коллега хочет сделать что-то на эмоциях — признай его чувство. Не поддержи действие и не останови его.","q1":"Удалось остаться с чувством?","q2":"Что было труднее — не поддержать или не остановить?"},{"d":27,"df":"hd","cx":"pt","tk":"Когда партнёр скажет «не знаю почему мне плохо» — не ищи причину. Скажи что плохо без причины — тоже плохо.","q1":"Как он отреагировал?","q2":"Изменился ли разговор?"},{"d":28,"df":"hd","cx":"fr","tk":"Вспомни друга которого давно не слышал по-настоящему. Напиши или позвони — и просто спроси как он. Без своих новостей.","q1":"Что он рассказал?","q2":"Когда последний раз слушал его так?"},{"d":29,"df":"hd","cx":"sl","tk":"В разговоре где тебе самому больно — не уходи в голову. Назови что чувствуешь прямо в разговоре.","q1":"Удалось назвать?","q2":"Что изменилось в разговоре после этого?"},{"d":30,"df":"hd","cx":"al","tk":"Вспомни один разговор за эти 30 дней где валидация получилась. Что именно сказал? Почему это сработало?","q1":"Что изменилось в тебе за месяц?","q2":"Одним предложением."}],"en":[{"d":1,"df":"ey","cx":"fr","tk":"When someone complains today — say one sentence without advice. Just name what the person is feeling.","q1":"Did you manage to hold back advice?","q2":"What did you say instead?"},{"d":2,"df":"ey","cx":"sl","tk":"Recall a recent conversation where you felt bad. What did you want to hear — but didn't?","q1":"In one sentence — what validation would have been accurate.","q2":"Was it easy to put into words?"},{"d":3,"df":"ey","cx":"cl","tk":"In a conversation today — let the person finish. Don't complete their thought.","q1":"Did you feel the urge to interrupt?","q2":"At what moment?"},{"d":4,"df":"ey","cx":"pt","tk":"When your partner says 'everything's fine' — ask once: 'really?' And listen.","q1":"What was behind 'fine'?","q2":"Did you expect that?"},{"d":5,"df":"ey","cx":"sl","tk":"Today, notice a moment when you felt uncomfortable. Name the feeling — at least to yourself.","q1":"What was the feeling called?","q2":"Was it easy to identify?"},{"d":6,"df":"ey","cx":"fr","tk":"In the next conversation where a friend complains — don't say 'I understand'. Say what exactly you understand.","q1":"What did you say instead of 'I understand'?","q2":"How did it sound?"},{"d":7,"df":"ey","cx":"cl","tk":"When a colleague gets upset over something small — don't say 'come on, it's nothing'. Just nod.","q1":"Was it hard not to dismiss?","q2":"What did you feel?"},{"d":8,"df":"ey","cx":"pt","tk":"Text your partner a short message: 'How are you?' — and sincerely wait for a response. Don't add your own news.","q1":"What did they reply?","q2":"Did you expect that?"},{"d":9,"df":"ey","cx":"sl","tk":"When you feel bad today — don't tell yourself 'pull it together'. Say what exactly is hard.","q1":"What was hard?","q2":"Did it get easier when you named it?"},{"d":10,"df":"md","cx":"fr","tk":"In a conversation where a friend is angry — don't calm them down or explain why they shouldn't be angry. Just say the anger makes sense.","q1":"Did you hold back from explaining?","q2":"What was the hardest part?"},{"d":11,"df":"md","cx":"pt","tk":"Recall a moment this week when you tried to comfort your partner. What did you say? What would have been more accurate?","q1":"In one sentence — how would you respond now.","q2":"Why did you say something different then?"},{"d":12,"df":"md","cx":"cl","tk":"When a colleague says 'I'm probably overreacting' — don't agree or argue. Say their feeling is real.","q1":"How did the colleague react?","q2":"Did the conversation change?"},{"d":13,"df":"md","cx":"sl","tk":"Find a situation this week where you dismissed your own feeling. How would you respond to yourself now?","q1":"What exactly did you dismiss?","q2":"Why did you do that then?"},{"d":14,"df":"md","cx":"pt","tk":"When your partner says they're tired today — don't offer a solution. Ask: 'tired of what exactly?'","q1":"What was behind the tiredness?","q2":"Where did the conversation go?"},{"d":15,"df":"md","cx":"sl","tk":"Today, notice one moment when you dismissed someone's feeling — even in your mind. Just notice, don't judge yourself.","q1":"What was it?","q2":"Why did you want to dismiss it?"},{"d":16,"df":"md","cx":"fr","tk":"In a conversation with a friend — say one sentence that acknowledges their state. Without 'but' after.","q1":"How did they react?","q2":"Was it hard not to add 'but'?"},{"d":17,"df":"md","cx":"cl","tk":"When a colleague blames themselves for a mistake — don't say 'it's not your fault'. Acknowledge that it's heavy to carry.","q1":"What did you say?","q2":"How is this different from 'it's not your fault'?"},{"d":18,"df":"md","cx":"sl","tk":"Try self-validation out loud. Say one sentence about what's hard right now — without judgment and without a plan.","q1":"What did you say?","q2":"How did it sound?"},{"d":19,"df":"hd","cx":"pt","tk":"In a conversation where your partner is angry — first acknowledge the anger. Then say the rest.","q1":"Did the conversation change after acknowledging?","q2":"How exactly?"},{"d":20,"df":"hd","cx":"fr","tk":"Find a friend who's struggling — and say something validating not because they asked, but because you noticed.","q1":"How did they react to the unexpected support?","q2":"Was it hard to initiate?"},{"d":21,"df":"hd","cx":"cl","tk":"When a colleague talks about pain you don't share — don't say 'if I were you'. Acknowledge their experience is different.","q1":"Was it hard not to compare with your own experience?","q2":"What did you say instead?"},{"d":22,"df":"hd","cx":"sl","tk":"When you want to dismiss how you feel today — notice it and say one sentence acknowledging that things are hard right now.","q1":"What exactly did you want to dismiss?","q2":"Did you manage to stop the inner voice?"},{"d":23,"df":"hd","cx":"pt","tk":"In a conversation where your partner expresses two conflicting feelings — name both. Don't choose between them.","q1":"How did they react when both feelings were acknowledged?","q2":"Was it hard not to pick one?"},{"d":24,"df":"hd","cx":"fr","tk":"Today, stay silent where you'd usually comfort. Just nod or say 'yes'. See what happens.","q1":"What happened after the pause?","q2":"Where did the conversation go?"},{"d":25,"df":"hd","cx":"sl","tk":"Find a feeling you're ashamed of. Say one sentence that acknowledges it — without judgment.","q1":"What was the feeling?","q2":"Did it get easier after acknowledging?"},{"d":26,"df":"hd","cx":"cl","tk":"In a conversation where a colleague wants to act on emotions — acknowledge the feeling. Don't support the action and don't stop them.","q1":"Did you manage to stay with the feeling?","q2":"What was harder — not supporting or not stopping?"},{"d":27,"df":"hd","cx":"pt","tk":"When your partner says 'I don't know why I feel bad' — don't look for a reason. Say that feeling bad without a reason is still feeling bad.","q1":"How did they react?","q2":"Did the conversation change?"},{"d":28,"df":"hd","cx":"fr","tk":"Think of a friend you haven't truly listened to in a while. Text or call — and just ask how they are. Without your own news.","q1":"What did they share?","q2":"When was the last time you listened to them like this?"},{"d":29,"df":"hd","cx":"sl","tk":"In a conversation where you're in pain — don't retreat into your head. Name what you feel right in the conversation.","q1":"Did you manage to name it?","q2":"What changed in the conversation after that?"},{"d":30,"df":"hd","cx":"al","tk":"Recall one conversation during these 30 days where validation worked. What exactly did you say? Why did it work?","q1":"What changed in you over the month?","q2":"In one sentence."}]};
